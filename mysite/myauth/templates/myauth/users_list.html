{% extends 'myauth/base.html' %}

{% block title %}
    Users List
{% endblock %}

{% block body %}
    <h1>Users</h1>
    <ul>
        {% for user in users %}
            <li>
                <a href="{% url 'myauth:user_details' pk=user.pk %}">
                    {{ user.username }}</a> and user pk is {{ user.pk }}
            </li>
        {% endfor %}
    </ul>
{% endblock %}
