{% extends 'bookapp/base.html' %}

{% block title %}
    Create book
{% endblock %}

{% block body %}
    <h1> Create a new book </h1>
    <div>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            {{ form.as_p }}

        <button type="submit">
          Create
        </button>
        </form>
    </div>

<div>
    <a href="{% url 'bookapp:books_list' %}"
    >Back to book list</a>
</div>

{% endblock %}
